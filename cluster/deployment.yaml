apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodeibot-deployment
spec:
  selector:
    matchLabels:
      app: nodeibot
  replicas: 1
  template:
    metadata:
      labels:
        app: nodeibot
    spec:
      containers:
        - name: nodeibot
          image: $(IMAGE)
          env:
            - name: ENVIRONMENT
              value: production
            - name: DISCORD_HASH
              valueFrom:
                secretKeyRef:
                  name: nodeibot-env
                  key: DISCORD_HASH
            - name: GH_READ_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nodeibot-env
                  key: GH_READ_TOKEN
            - name: AMPLITUDE_KEY
              valueFrom:
                secretKeyRef:
                  name: nodeibot-env
                  key: AMPLITUDE_KEY
            - name: DISCORD_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: nodeibot-env
                  key: DISCORD_PUBLIC_KEY
            - name: DISCORD_APP_ID
              valueFrom:
                secretKeyRef:
                  name: nodeibot-env
                  key: DISCORD_APP_ID
            - name: GUILD_ID
              valueFrom:
                secretKeyRef:
                  name: nodeibot-env
                  key: GUILD_ID
            - name: OPENAI_KEY
              valueFrom:
                secretKeyRef:
                  name: nodeibot-env
                  key: OPENAI_KEY
            - name: REACTIBOT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nodeibot-env
                  key: REACTIBOT_API_KEY
